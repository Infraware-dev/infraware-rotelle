name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  MUSL_TARGET: x86_64-unknown-linux-musl

jobs:
  lint:
    name: Lint (fmt + clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: ${{ env.MUSL_TARGET }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rotelle

      - name: Check formatting
        run: cargo fmt --all --check
        working-directory: rotelle

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
        working-directory: rotelle

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: rotelle/Cargo.toml

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rotelle

      - name: Run tests
        run: cargo test --all-features
        working-directory: rotelle

  build:
    name: Build (musl smoke test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.MUSL_TARGET }}

      - name: Install musl tools
        run: sudo apt-get install -y musl-tools

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rotelle

      - name: Build binary (musl)
        run: cargo build --release --target ${{ env.MUSL_TARGET }}
        working-directory: rotelle

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: false
          build-args: MUSL_TARGET=${{ env.MUSL_TARGET }}
          tags: rotelle:ci-smoke

  hurl:
    name: Hurl integration tests
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rotelle

      - name: Install hurl
        run: |
          HURL_VERSION="6.1.0"
          curl -LO "https://github.com/Orange-OpenSource/hurl/releases/download/${HURL_VERSION}/hurl_${HURL_VERSION}_amd64.deb"
          sudo dpkg -i "hurl_${HURL_VERSION}_amd64.deb"

      - name: Build rotelle
        run: cargo build
        working-directory: rotelle

      - name: Start rotelle server
        run: |
          mkdir -p /tmp/rotelle-data
          DATA_DIR=/tmp/rotelle-data ./rotelle/target/debug/rotelle &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8080/rotectl/health && break || sleep 1
          done
          curl -sf http://127.0.0.1:8080/rotectl/health || { echo "Server failed to start"; exit 1; }

      - name: Run control-path tests
        run: |
          hurl \
            --test \
            --variable rotelle_service_host=http://127.0.0.1:8080 \
            tests/hurl-scenario/check.hurl

      - name: Run scenario smoke tests
        run: |
          for f in tests/hurl-scenario/*.hurl; do
            [ "$(basename $f)" = "check.hurl" ] && continue
            echo "--- $(basename $f) ---"
            hurl \
              --variable rotelle_service_host=http://127.0.0.1:8080 \
              "$f"
          done
