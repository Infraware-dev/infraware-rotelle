name: Publish to GHCR

on:
  push:
    tags:
      - 'v[0-9]*'
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/infraware-dev/infraware-rotelle

jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
            musl_target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            arch: arm64
            musl_target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Validate tag
        run: |
          if [[ ! "${{ github.ref_name }}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '${{ github.ref_name }}' does not match vX.Y.Z"
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.musl_target }}

      - name: Install musl tools
        run: sudo apt-get install -y musl-tools

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rotelle
          key: ${{ matrix.arch }}

      - name: Build binary
        run: cargo build --release --target ${{ matrix.musl_target }}
        working-directory: rotelle

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push platform image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          platforms: linux/${{ matrix.arch }}
          build-args: MUSL_TARGET=${{ matrix.musl_target }}
          tags: ${{ env.IMAGE }}:${{ github.ref_name }}-${{ matrix.arch }}

  merge:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push multi-arch manifest
        run: |
          docker buildx imagetools create \
            --tag ${{ env.IMAGE }}:${{ github.ref_name }} \
            --tag ${{ env.IMAGE }}:latest \
            ${{ env.IMAGE }}:${{ github.ref_name }}-amd64 \
            ${{ env.IMAGE }}:${{ github.ref_name }}-arm64

  github-release:
    needs: merge
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Package Helm charts
        run: |
          tar -czf rotelle-helm-chart.tgz -C helm rotelle
          tar -czf observability-gp-mini-helm-chart.tgz -C helm observability-gp-mini

      - name: Create GitHub Release
        run: |
          gh release create ${{ github.ref_name }} \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            --latest \
            rotelle-helm-chart.tgz \
            observability-gp-mini-helm-chart.tgz
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
