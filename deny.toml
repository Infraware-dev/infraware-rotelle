[licenses]
# Allow permissive licenses common in the Rust ecosystem.
allow = [
    "Apache-2.0",
    "MIT",
    "Unicode-3.0",
]

[bans]
multiple-versions = "deny"
deny = []

[advisories]
version = 2
db-urls = ["https://github.com/rustsec/advisory-db"]
ignore = []

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
