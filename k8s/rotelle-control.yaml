apiVersion: v1
kind: Namespace
metadata:
  name: rotelle-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rotelle-control
  namespace: rotelle-system
  labels:
    app: rotelle-control
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rotelle-control
  template:
    metadata:
      labels:
        app: rotelle-control
    spec:
      containers:
        - name: rotelle-control
          image: ghcr.io/infraware-dev/infraware-rotelle:v0.1.0
          imagePullPolicy: IfNotPresent
          env:
            - name: ROTELLE_MODE
              value: "control"
            - name: ROTELLE_PORT
              value: "9090"
            - name: DATA_DIR
              value: /data
            # Internal cluster URL of the sim pod's API — used for proxying commands and health probes.
            - name: ROTELLE_SIM_API_URL
              value: "http://rotelle.rotelle.svc.cluster.local:8080"
            # Browser-facing URL of the sim service — used for the "Status" nav link in the control panel.
            # Set this to the URL your browser uses to reach the sim pod.
            # Examples:
            #   LoadBalancer:   http://<sim-external-ip>
            #   port-forward:   http://localhost:8080
            - name: ROTELLE_SIM_URL
              value: "http://localhost:8080"
          ports:
            - name: control
              containerPort: 9090
          readinessProbe:
            httpGet:
              path: /rotectl/health
              port: control
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /rotectl/health
              port: control
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              memory: "32Mi"
            limits:
              memory: "128Mi"
          volumeMounts:
            - name: data
              mountPath: /data

      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: rotelle-control
  namespace: rotelle-system
spec:
  selector:
    app: rotelle-control
  ports:
    - name: control
      port: 9090
      targetPort: control
  type: ClusterIP
