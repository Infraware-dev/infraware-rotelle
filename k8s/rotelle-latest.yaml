# rotelle-latest.yaml — always pulls the latest published image.
# Use for quick installs; for production pin to a specific version via rotelle.yaml.
apiVersion: v1
kind: Namespace
metadata:
  name: rotelle
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rotelle
  namespace: rotelle
  labels:
    app: rotelle
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rotelle
  template:
    metadata:
      labels:
        app: rotelle
    spec:
      containers:
        - name: rotelle
          image: ghcr.io/infraware-dev/infraware-rotelle:latest
          imagePullPolicy: Always
          env:
            - name: ROTELLE_MODE
              value: "sim"
            - name: DATA_DIR
              value: /data
            - name: ROTELLE_CONTROL_URL
              value: "http://localhost:9090/rotectl/control"
          ports:
            - name: http
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              memory: "32Mi"
            limits:
              memory: "64Mi"
          volumeMounts:
            - name: state
              mountPath: /data

        - name: rotelle-control
          image: ghcr.io/infraware-dev/infraware-rotelle:latest
          imagePullPolicy: Always
          env:
            - name: ROTELLE_MODE
              value: "control"
            - name: ROTELLE_PORT
              value: "9090"
            - name: DATA_DIR
              value: /data
            - name: ROTELLE_SIM_URL
              value: "http://localhost:8080"
          ports:
            - name: control
              containerPort: 9090
          readinessProbe:
            httpGet:
              path: /rotectl/health
              port: control
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /rotectl/health
              port: control
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              memory: "32Mi"
            limits:
              memory: "256Mi"
          volumeMounts:
            - name: state
              mountPath: /data

      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: rotelle-state
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rotelle-state
  namespace: rotelle
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Mi
---
apiVersion: v1
kind: Service
metadata:
  name: rotelle
  namespace: rotelle
spec:
  selector:
    app: rotelle
  ports:
    - name: http
      port: 8080
      targetPort: http
  type: LoadBalancer
---
apiVersion: v1
kind: Service
metadata:
  name: rotelle-control
  namespace: rotelle
spec:
  selector:
    app: rotelle
  ports:
    - name: control
      port: 9090
      targetPort: control
  type: LoadBalancer
