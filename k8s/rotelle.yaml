apiVersion: v1
kind: Namespace
metadata:
  name: rotelle
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rotelle
  namespace: rotelle
  labels:
    app: rotelle
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rotelle
  template:
    metadata:
      labels:
        app: rotelle
    spec:
      containers:
        - name: rotelle
          image: rotelle:dev
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /rotectl/health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          volumeMounts:
            - name: state
              mountPath: /data
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: rotelle-state
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rotelle-state
  namespace: rotelle
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Mi
---
apiVersion: v1
kind: Service
metadata:
  name: rotelle
  namespace: rotelle
spec:
  selector:
    app: rotelle
  ports:
    - name: http
      port: 8080
      targetPort: http
  type: LoadBalancer
