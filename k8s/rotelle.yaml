apiVersion: v1
kind: Namespace
metadata:
  name: rotelle
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rotelle
  namespace: rotelle
  labels:
    app: rotelle
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rotelle
  template:
    metadata:
      labels:
        app: rotelle
    spec:
      containers:
        - name: rotelle
          image: ghcr.io/infraware-dev/infraware-rotelle:v0.1.0
          imagePullPolicy: IfNotPresent
          env:
            - name: DATA_DIR
              value: /data
            # Optional: set ROTELLE_CONTROL_URL to the external control pod URL so the
            # "Control" nav link on the sim surface points to the crash-isolated pod.
            # Example (port-forward): http://localhost:9090/rotectl/control
            # Leave unset to use the sim pod's own built-in control panel (/rotectl/control).
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /rotectl/health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              memory: "32Mi"
            limits:
              memory: "64Mi"
          volumeMounts:
            - name: state
              mountPath: /data

      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: rotelle-state
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rotelle-state
  namespace: rotelle
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Mi
---
apiVersion: v1
kind: Service
metadata:
  name: rotelle
  namespace: rotelle
spec:
  selector:
    app: rotelle
  ports:
    - name: http
      port: 8080
      targetPort: http
  type: LoadBalancer
