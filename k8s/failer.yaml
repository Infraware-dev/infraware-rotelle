apiVersion: v1
kind: Namespace
metadata:
  name: failer
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: failer
  namespace: failer
  labels:
    app: failer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: failer
  template:
    metadata:
      labels:
        app: failer
    spec:
      containers:
        - name: failer
          image: failer:dev
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /failctl/health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          volumeMounts:
            - name: state
              mountPath: /data
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: failer-state
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: failer-state
  namespace: failer
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Mi
---
apiVersion: v1
kind: Service
metadata:
  name: failer
  namespace: failer
spec:
  selector:
    app: failer
  ports:
    - name: http
      port: 8080
      targetPort: http
  type: ClusterIP
