{{- if .Values.otelGateway.rbac.create -}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "observability-gp-mini.otelGateway.fullnameClusterUnique" . }}
  labels:
    {{- include "observability-gp-mini.componentLabels" (dict "ctx" . "component" "otel-gateway") | nindent 4 }}
rules:
  # Scoped to events only, for the k8s_events receiver's watch (see
  # otelGateway.config.receivers). Two apiGroups because Events exist in both
  # the legacy core group and events.k8s.io (the receiver watches whichever
  # the cluster serves).
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["events.k8s.io"]
    resources: ["events"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "observability-gp-mini.otelGateway.fullnameClusterUnique" . }}
  labels:
    {{- include "observability-gp-mini.componentLabels" (dict "ctx" . "component" "otel-gateway") | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "observability-gp-mini.otelGateway.fullnameClusterUnique" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "observability-gp-mini.otelGateway.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
