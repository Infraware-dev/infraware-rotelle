apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "observability-gp-mini.k8sEventsExporter.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "observability-gp-mini.componentLabels" (dict "ctx" . "component" "k8s-events-exporter") | nindent 4 }}
spec:
  # Single replica: this is an events tailer, not a store — nothing here
  # needs it highly available, and leader election for a second replica is
  # more moving parts than a reference stack needs.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "observability-gp-mini.componentSelectorLabels" (dict "ctx" . "component" "k8s-events-exporter") | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/k8s-events-exporter/configmap.yaml") . | sha256sum }}
        {{- with .Values.k8sEventsExporter.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "observability-gp-mini.componentSelectorLabels" (dict "ctx" . "component" "k8s-events-exporter") | nindent 8 }}
        {{- with .Values.k8sEventsExporter.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "observability-gp-mini.k8sEventsExporter.serviceAccountName" . }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: k8s-events-exporter
          image: "{{ .Values.k8sEventsExporter.image.repository }}:{{ .Values.k8sEventsExporter.image.tag }}"
          imagePullPolicy: {{ .Values.k8sEventsExporter.image.pullPolicy }}
          args:
            - -conf=/data/config.yaml
          ports:
            - name: metrics
              containerPort: 2112
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /-/ready
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 15
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.k8sEventsExporter.resources | nindent 12 }}
          volumeMounts:
            - name: cfg
              mountPath: /data
      volumes:
        - name: cfg
          configMap:
            name: {{ include "observability-gp-mini.k8sEventsExporter.fullname" . }}
      {{- with .Values.k8sEventsExporter.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.k8sEventsExporter.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.k8sEventsExporter.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
