{{- /*
Builds the exporter's config.yaml from .Values.k8sEventsExporter.config,
optionally appending a second "stdout" receiver + route when
.Values.k8sEventsExporter.debugStdout.enabled — kept out of .config itself so
the default (single loki receiver) stays a plain, directly-editable value
block.
*/}}
{{- $cfg := .Values.k8sEventsExporter.config -}}
{{- $receivers := $cfg.receivers -}}
{{- $routes := $cfg.route.routes -}}
{{- if .Values.k8sEventsExporter.debugStdout.enabled }}
{{- $receivers = append $receivers (dict "name" "stdout" "stdout" dict) }}
{{- $routes = append $routes (dict "match" (list (dict "receiver" "stdout"))) }}
{{- end }}
{{- $config := dict
  "logLevel" $cfg.logLevel
  "logFormat" $cfg.logFormat
  "maxEventAgeSeconds" $cfg.maxEventAgeSeconds
  "omitLookup" $cfg.omitLookup
  "route" (dict "routes" $routes)
  "receivers" $receivers
-}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "observability-gp-mini.k8sEventsExporter.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "observability-gp-mini.componentLabels" (dict "ctx" . "component" "k8s-events-exporter") | nindent 4 }}
data:
  config.yaml: |
    {{- toYaml $config | nindent 4 }}
